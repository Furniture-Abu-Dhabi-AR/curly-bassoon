<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Closet AR — Android + iPhone</title>
<style>
  :root{--ui-bg:rgba(255,255,255,0.95);--accent:#5b6cff;--muted:#666}
  html,body{height:100%;margin:0;font-family:system-ui,Roboto,Arial;background:linear-gradient(135deg,#2b6df6 0%,#8b5cf6 100%)}
  #container{width:100%;height:100%;position:relative;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  .ui-card{position:fixed;left:50%;top:12%;transform:translateX(-50%);background:var(--ui-bg);padding:18px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:92%;width:420px;text-align:center}
  .ui-title{font-weight:700;margin:0 0 6px 0}
  .ui-sub{color:var(--muted);font-size:14px;margin:0 0 12px 0}
  .controls{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px}
  .btn{background:var(--accent);color:#fff;border:0;padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer}
  .btn.secondary{background:#fff;color:var(--accent);border:1px solid rgba(0,0,0,.06)}
  .slider{width:180px}
  .bottom-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:999}
  .hint{position:fixed;left:12px;bottom:18px;color:#fff;background:rgba(0,0,0,.25);padding:8px 12px;border-radius:10px;font-size:13px}
  .loader{display:inline-block;width:18px;height:18px;border-radius:50%;border:3px solid rgba(0,0,0,.08);border-top-color:var(--accent);animation:spin .9s linear infinite;vertical-align:middle;margin-left:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hidden{display:none}
</style>
</head>
<body>
<div id="container"></div>

<div class="ui-card" id="uiCard" aria-hidden="false">
  <h1 class="ui-title">Closet AR</h1>
  <p class="ui-sub">Посмотрите мебель в вашем интерьере 🔘 Запустить AR без маркеров</p>

  <div id="statusLine"><span id="statusText">Загрузка сцены…</span><span id="loader" class="loader"></span></div>

  <div class="controls" style="margin-top:12px">
    <button id="androidBtn" class="btn">AR для Android</button>
    <a id="iphoneLink" rel="ar" href="model.usdz"><button class="btn secondary">AR для iPhone</button></a>
  </div>

  <div style="margin-top:12px;display:flex;gap:8px;align-items:center;justify-content:center">
    <button id="decBtn" class="btn secondary">−</button>
    <input id="scaleSlider" class="slider" type="range" min="0.1" max="3" step="0.01" value="1">
    <button id="incBtn" class="btn secondary">+</button>
  </div>

  <p style="font-size:13px;color:var(--muted);margin-top:10px">Нажмите на пол, чтобы поместить модель. Свайп — вращение. Пинч — масштаб.</p>
</div>

<div class="bottom-bar">
  <button id="resetBtn" class="btn secondary">Сбросить позицию</button>
  <button id="helpBtn" class="btn secondary">Как использовать</button>
</div>

<div class="hint" id="hint">Направьте камеру на пол или стену</div>

<script type="module">
/* ======= Конфигурация ======= */
const MODEL_GLB = 'model.glb';
const USDZ_PATH = 'model.usdz';

/* ======= Импорты three.js ======= */
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

/* ======= DOM ======= */
const container = document.getElementById('container');
const statusText = document.getElementById('statusText');
const loaderEl = document.getElementById('loader');
const androidBtn = document.getElementById('androidBtn');
const iphoneLink = document.getElementById('iphoneLink');
const scaleSlider = document.getElementById('scaleSlider');
const decBtn = document.getElementById('decBtn');
const incBtn = document.getElementById('incBtn');
const resetBtn = document.getElementById('resetBtn');
const helpBtn = document.getElementById('helpBtn');
const hint = document.getElementById('hint');

/* ======= Renderer / Scene ======= */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
scene.add(light);

/* ======= Model loading ======= */
const loader = new GLTFLoader();
let model = null;
let placed = false;
let modelScale = parseFloat(localStorage.getItem('ar_model_scale') || '1');
let modelRotationY = parseFloat(localStorage.getItem('ar_model_rot') || '0');

scaleSlider.value = modelScale;

statusText.textContent = 'Загружаем модель…';
loader.load(MODEL_GLB, gltf => {
  model = gltf.scene;
  model.traverse(n => { if (n.isMesh) n.castShadow = n.receiveShadow = true; });
  model.scale.set(modelScale, modelScale, modelScale);
  model.rotation.y = modelRotationY;
  statusText.textContent = 'Готово. Нажмите AR и коснитесь поверхности';
  loaderEl.classList.add('hidden');
}, xhr => {
  // progress optional
}, err => {
  statusText.textContent = 'Ошибка загрузки модели';
  loaderEl.classList.add('hidden');
});

/* ======= AR Button (WebXR) ======= */
const arButton = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] });
arButton.style.display = 'none';
document.body.appendChild(arButton);

/* ======= Hit test ======= */
let hitTestSource = null;
let hitTestSourceRequested = false;
let localRefSpace = null;

/* ======= Placement logic ======= */
function placeModelAt(pose) {
  if (!model) return;
  const pos = pose.transform.position;
  model.position.set(pos.x, pos.y, pos.z);
  if (!scene.children.includes(model)) scene.add(model);
  placed = true;
  saveState();
}

renderer.setAnimationLoop((timestamp, frame) => {
  if (frame) {
    const session = renderer.xr.getSession();
    if (session && !hitTestSourceRequested) {
      session.requestReferenceSpace('viewer').then(ref => {
        session.requestHitTestSource({ space: ref }).then(source => {
          hitTestSource = source;
        });
      });
      session.requestReferenceSpace('local-floor').then(r => localRefSpace = r);
      hitTestSourceRequested = true;
    }

    if (hitTestSource && localRefSpace) {
      const hit = frame.getHitTestResults(hitTestSource)[0];
      if (hit && !placed) {
        const pose = hit.getPose(localRefSpace);
        // show a subtle hint where to tap
        hint.textContent = 'Нажмите, чтобы поместить';
      }
    }
  }
  renderer.render(scene, camera);
});

/* ======= Input: tap to place ======= */
renderer.domElement.addEventListener('click', (ev) => {
  const session = renderer.xr.getSession();
  if (!session || !hitTestSource || !localRefSpace) return;
  // Use last frame's hit test result
  session.requestAnimationFrame((t, frame) => {
    const hit = frame.getHitTestResults(hitTestSource)[0];
    if (hit) {
      const pose = hit.getPose(localRefSpace);
      placeModelAt(pose);
      hint.textContent = 'Модель размещена. Используйте ползунок для масштаба';
    }
  });
});

/* ======= Touch gestures: rotate + pinch ======= */
let ongoingTouches = [];
let lastTouchDist = null;
let lastTouchX = null;

function getDistance(t1, t2) {
  const dx = t2.clientX - t1.clientX;
  const dy = t2.clientY - t1.clientY;
  return Math.hypot(dx, dy);
}

renderer.domElement.addEventListener('touchstart', e => {
  if (!placed || !model) return;
  if (e.touches.length === 1) {
    lastTouchX = e.touches[0].clientX;
  } else if (e.touches.length === 2) {
    lastTouchDist = getDistance(e.touches[0], e.touches[1]);
  }
}, {passive:true});

renderer.domElement.addEventListener('touchmove', e => {
  if (!placed || !model) return;
  if (e.touches.length === 1 && lastTouchX !== null) {
    const dx = e.touches[0].clientX - lastTouchX;
    const rotY = dx * 0.005;
    model.rotation.y += rotY;
    modelRotationY = model.rotation.y;
    lastTouchX = e.touches[0].clientX;
    saveStateDebounced();
  } else if (e.touches.length === 2 && lastTouchDist !== null) {
    const dist = getDistance(e.touches[0], e.touches[1]);
    const factor = dist / lastTouchDist;
    modelScale = Math.max(0.1, Math.min(3, modelScale * factor));
    model.scale.set(modelScale, modelScale, modelScale);
    scaleSlider.value = modelScale;
    lastTouchDist = dist;
    saveStateDebounced();
  }
}, {passive:true});

renderer.domElement.addEventListener('touchend', e => {
  lastTouchDist = null;
  lastTouchX = null;
}, {passive:true});

/* ======= UI controls ======= */
scaleSlider.addEventListener('input', () => {
  modelScale = parseFloat(scaleSlider.value);
  if (model) model.scale.set(modelScale, modelScale, modelScale);
  saveStateDebounced();
});

decBtn.addEventListener('click', () => {
  modelScale = Math.max(0.1, modelScale - 0.05);
  scaleSlider.value = modelScale;
  if (model) model.scale.set(modelScale, modelScale, modelScale);
  saveState();
});

incBtn.addEventListener('click', () => {
  modelScale = Math.min(3, modelScale + 0.05);
  scaleSlider.value = modelScale;
  if (model) model.scale.set(modelScale, modelScale, modelScale);
  saveState();
});

resetBtn.addEventListener('click', () => {
  if (model) {
    scene.remove(model);
    placed = false;
    model.position.set(0,0,0);
    modelScale = 1;
    modelRotationY = 0;
    scaleSlider.value = modelScale;
    localStorage.removeItem('ar_model_pos');
    localStorage.removeItem('ar_model_scale');
    localStorage.removeItem('ar_model_rot');
    hint.textContent = 'Позиция сброшена. Нажмите на поверхность, чтобы поместить';
  }
});

helpBtn.addEventListener('click', () => {
  alert('Как использовать:\n\n• Направьте камеру на пол или стену\n• Нажмите на поверхность, чтобы поместить мебель\n• Свайп — вращение, пинч — масштаб\n• Используйте кнопки +/− или ползунок для точной подгонки');
});

/* ======= Android button triggers ARButton ======= */
androidBtn.addEventListener('click', () => {
  // ARButton is hidden; find it and click
  const btn = document.querySelector('button[title="Enter AR"]') || document.querySelector('button[aria-label="Enter AR"]');
  if (btn) btn.click();
  else {
    // fallback: show ARButton and click
    arButton.style.display = '';
    const b = arButton.querySelector('button');
    if (b) b.click();
  }
});

/* ======= Save / Restore state ======= */
function saveState() {
  localStorage.setItem('ar_model_scale', modelScale.toString());
  localStorage.setItem('ar_model_rot', modelRotationY.toString());
  if (model && placed) {
    const p = model.position;
    localStorage.setItem('ar_model_pos', JSON.stringify({x:p.x,y:p.y,z:p.z}));
  }
}

let saveTimeout = null;
function saveStateDebounced() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveState, 400);
}

function restoreState() {
  const s = localStorage.getItem('ar_model_pos');
  if (s && model) {
    try {
      const p = JSON.parse(s);
      model.position.set(p.x,p.y,p.z);
      if (!scene.children.includes(model)) scene.add(model);
      placed = true;
      hint.textContent = 'Восстановлена предыдущая позиция';
    } catch(e){}
  }
}

/* ======= Check USDZ availability for iPhone link ======= */
fetch(USDZ_PATH, {method:'HEAD'}).then(r => {
  if (!r.ok) {
    iphoneLink.style.display = 'none';
  }
}).catch(()=>{ iphoneLink.style.display = 'none'; });

/* ======= Resize handling ======= */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ======= When AR session starts, restore saved scale/rotation/position ======= */
renderer.xr.addEventListener('sessionstart', () => {
  if (model) {
    model.scale.set(modelScale, modelScale, modelScale);
    model.rotation.y = modelRotationY;
    restoreState();
  }
});

/* ======= Accessibility: keyboard placement for desktop testing ======= */
window.addEventListener('keydown', (e) => {
  if (e.key === 'p' && model) {
    // place model in front of camera for desktop testing
    const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
    const pos = camera.position.clone().add(dir.multiplyScalar(1.2));
    model.position.copy(pos);
    if (!scene.children.includes(model)) scene.add(model);
    placed = true;
    saveState();
    hint.textContent = 'Модель размещена (тест)';
  }
});

/* ======= Final UI tweaks after load ======= */
setTimeout(() => {
  if (!model) {
    statusText.textContent = 'Модель ещё загружается или отсутствует';
    loaderEl.classList.add('hidden');
  }
}, 4000);

/* ======= Save initial scale/rotation to localStorage if changed by slider ======= */
window.addEventListener('beforeunload', saveState);
</script>
</body>
</html>
