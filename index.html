<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Premium AR Viewer</title>

<!-- model-viewer -->
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    :root{
        --glass-bg:rgba(255,255,255,0.04);
        --glass-border:rgba(255,255,255,0.12);
        --neon:#00e5ff;
        --text-main:#ffffff;
        --text-sub:rgba(255,255,255,0.7);
    }

    body{
        width:100%;
        height:100vh;
        overflow:hidden;
        background:
            radial-gradient(circle at 10% 0%, #101018 0%, #050509 40%, #000000 100%);
        font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Arial,sans-serif;
        display:flex;
        justify-content:center;
        align-items:center;
        color:var(--text-main);
    }

    .bg-glow{
        position:fixed;
        inset:0;
        pointer-events:none;
        z-index:-1;
    }

    .bg-glow::before,
    .bg-glow::after{
        content:"";
        position:absolute;
        width:420px;
        height:420px;
        border-radius:50%;
        filter:blur(80px);
        opacity:0.45;
        mix-blend-mode:screen;
    }

    .bg-glow::before{
        background:radial-gradient(circle,var(--neon),transparent 60%);
        top:-120px;
        left:-80px;
    }

    .bg-glow::after{
        background:radial-gradient(circle,#7b5cff,transparent 60%);
        bottom:-140px;
        right:-60px;
    }

    .container{
        position:relative;
        width:100%;
        max-width:520px;
        height:80vh;
        max-height:720px;
        padding:18px;
        display:flex;
        flex-direction:column;
        justify-content:space-between;
        align-items:center;
    }

    .glass-card{
        position:relative;
        width:100%;
        height:100%;
        border-radius:28px;
        padding:20px 20px 80px;
        background:linear-gradient(145deg,rgba(255,255,255,0.06),rgba(255,255,255,0.01));
        border:1px solid var(--glass-border);
        box-shadow:
            0 24px 80px rgba(0,0,0,0.8),
            0 0 40px rgba(0,229,255,0.18);
        backdrop-filter:blur(26px);
        -webkit-backdrop-filter:blur(26px);
        overflow:hidden;
    }

    .glass-card::before{
        content:"";
        position:absolute;
        inset:0;
        background:linear-gradient(135deg,rgba(255,255,255,0.16),transparent 40%,rgba(0,229,255,0.12) 70%,transparent 100%);
        opacity:0.12;
        pointer-events:none;
    }

    .header{
        position:relative;
        z-index:2;
        text-align:left;
        margin-bottom:10px;
    }

    .badge{
        display:inline-flex;
        align-items:center;
        gap:8px;
        padding:4px 10px;
        border-radius:999px;
        background:rgba(0,0,0,0.6);
        border:1px solid rgba(255,255,255,0.12);
        font-size:11px;
        text-transform:uppercase;
        letter-spacing:0.12em;
        color:var(--text-sub);
        margin-bottom:10px;
    }

    .badge-dot{
        width:7px;
        height:7px;
        border-radius:50%;
        background:var(--neon);
        box-shadow:0 0 12px var(--neon);
    }

    .title{
        font-size:30px;
        font-weight:700;
        letter-spacing:0.12em;
        text-transform:uppercase;
        margin-bottom:6px;
        text-shadow:0 0 24px rgba(0,0,0,0.8);
    }

    .subtitle{
        font-size:14px;
        color:var(--text-sub);
    }

    .viewer-wrap{
        position:relative;
        margin-top:14px;
        border-radius:22px;
        overflow:hidden;
        background:
            radial-gradient(circle at 20% 0%,rgba(0,229,255,0.18),transparent 55%),
            radial-gradient(circle at 80% 100%,rgba(123,92,255,0.22),transparent 55%),
            #050509;
        box-shadow:
            0 26px 60px rgba(0,0,0,0.9),
            0 0 40px rgba(0,229,255,0.25);
    }

    model-viewer{
        width:100%;
        height:360px;
        --poster-color:transparent;
    }

    .viewer-overlay-gradient{
        position:absolute;
        inset:0;
        pointer-events:none;
        background:
            radial-gradient(circle at 50% 120%,rgba(0,0,0,0.9),transparent 55%),
            linear-gradient(to top,rgba(0,0,0,0.45),transparent 40%);
        mix-blend-mode:multiply;
    }

    .bottom-bar{
        position:absolute;
        left:0;
        right:0;
        bottom:0;
        padding:18px 20px 20px;
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:10px;
        background:linear-gradient(to top,rgba(0,0,0,0.9),transparent);
        z-index:3;
    }

    .meta{
        display:flex;
        flex-direction:column;
        gap:4px;
    }

    .meta-label{
        font-size:11px;
        text-transform:uppercase;
        letter-spacing:0.16em;
        color:var(--text-sub);
    }

    .meta-value{
        font-size:13px;
        color:var(--text-main);
        opacity:0.9;
    }

    .ar-button{
        position:relative;
        padding:14px 26px;
        border:none;
        border-radius:999px;
        background:radial-gradient(circle at 0% 0%,#ffffff, #d9d9d9);
        color:#000;
        font-size:14px;
        font-weight:700;
        cursor:pointer;
        letter-spacing:0.14em;
        text-transform:uppercase;
        box-shadow:
            0 14px 40px rgba(0,0,0,0.9),
            0 0 26px rgba(255,255,255,0.35);
        transition:transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        white-space:nowrap;
    }

    .ar-button::before{
        content:"";
        position:absolute;
        inset:-1px;
        border-radius:inherit;
        border:1px solid rgba(0,0,0,0.12);
        pointer-events:none;
    }

    .ar-button:hover{
        transform:translateY(-2px);
        box-shadow:
            0 18px 50px rgba(0,0,0,0.95),
            0 0 34px rgba(255,255,255,0.5);
        background:radial-gradient(circle at 0% 0%,#ffffff,#f5f5f5);
    }

    .ar-button:active{
        transform:translateY(0);
        box-shadow:
            0 10px 26px rgba(0,0,0,0.9),
            0 0 20px rgba(255,255,255,0.35);
    }

    .loading{
        position:absolute;
        inset:0;
        display:flex;
        justify-content:center;
        align-items:center;
        background:radial-gradient(circle at 50% 0%,rgba(0,0,0,0.9),rgba(0,0,0,1));
        z-index:20;
        transition:opacity 0.5s ease;
    }

    .loading.hidden{
        opacity:0;
        pointer-events:none;
    }

    .loader-ring{
        width:70px;
        height:70px;
        border-radius:50%;
        border:4px solid rgba(255,255,255,0.08);
        border-top:4px solid var(--neon);
        animation:spin 1s linear infinite;
        box-shadow:0 0 24px rgba(0,229,255,0.6);
    }

    .loader-glow{
        position:absolute;
        width:140px;
        height:140px;
        border-radius:50%;
        background:radial-gradient(circle,var(--neon),transparent 60%);
        filter:blur(40px);
        opacity:0.4;
    }

    @keyframes spin{
        to{ transform:rotate(360deg); }
    }

    @media(max-width:768px){
        .container{
            height:100vh;
            max-height:none;
            padding:14px;
        }

        .glass-card{
            padding:16px 14px 80px;
            border-radius:24px;
        }

        .title{
            font-size:22px;
        }

        .subtitle{
            font-size:13px;
        }

        model-viewer{
            height:320px;
        }

        .bottom-bar{
            padding:14px 14px 18px;
        }

        .meta-label{
            font-size:10px;
        }

        .meta-value{
            font-size:12px;
        }

        .ar-button{
            padding:12px 20px;
            font-size:12px;
        }
    }

    @media(max-width:480px){
        model-viewer{
            height:300px;
        }
    }
</style>
</head>

<body>

<div class="bg-glow"></div>

<div class="container">
    <div class="glass-card" id="card">

        <div class="loading" id="loading">
            <div class="loader-glow"></div>
            <div class="loader-ring"></div>
        </div>

        <div class="header">
            <div class="badge">
                <span class="badge-dot"></span>
                <span>REAL‑TIME AR OBJECT</span>
            </div>
            <div class="title">AR EXPERIENCE</div>
            <div class="subtitle">Premium 3D visualization for iOS & Android</div>
        </div>

        <div class="viewer-wrap">
            <model-viewer
                id="viewer"
                src="qwe.glb"
                ios-src="qwe.usdz"
                alt="3D Model"
                ar
                ar-modes="scene-viewer quick-look webxr"
                camera-controls
                touch-action="pan-y"
                shadow-intensity="1.4"
                exposure="1.05"
                auto-rotate
                rotation-per-second="25deg"
                camera-orbit="0deg 75deg 2.5m"
                field-of-view="30deg"
                environment-image="neutral"
                loading="eager">
            </model-viewer>

            <div class="viewer-overlay-gradient"></div>

            <div class="bottom-bar">
                <div class="meta">
                    <div class="meta-label">AR READY</div>
                    <div class="meta-value">iPhone · Android · Web</div>
                </div>
                <button class="ar-button" onclick="activateAR()">
                    OPEN AR
                </button>
            </div>
        </div>

    </div>
</div>

<script>
    const viewer = document.getElementById('viewer');
    const loading = document.getElementById('loading');
    const card = document.getElementById('card');

    viewer.addEventListener('load', () => {
        loading.classList.add('hidden');
    });

    function activateAR(){
        if (viewer && viewer.activateAR) {
            viewer.activateAR();
        }
    }

    // лёгкий параллакс для премиум‑ощущения
    let parallaxEnabled = true;

    function handleParallax(e){
        if(!parallaxEnabled) return;
        const rect = card.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        const rotateX = y * -4;
        const rotateY = x * 6;
        card.style.transform = `translateY(0) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    }

    function resetParallax(){
        card.style.transform = 'translateY(0) rotateX(0deg) rotateY(0deg)';
    }

    document.addEventListener('mousemove', handleParallax);
    document.addEventListener('mouseleave', resetParallax);

    // отключаем параллакс на очень маленьких экранах
    if (window.matchMedia('(max-width: 600px)').matches) {
        parallaxEnabled = false;
        resetParallax();
    }
</script>

</body>
</html>
