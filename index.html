<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Premium AR Viewer</title>

<!-- model-viewer -->
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        width:100%;
        height:100vh;
        overflow:hidden;
        background:#050505;
        font-family:Arial, sans-serif;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .container{
        position:relative;
        width:100%;
        height:100%;
    }

    model-viewer{
        width:100%;
        height:100%;
        background:
            radial-gradient(circle at center,
            #1b1b1b 0%,
            #090909 50%,
            #000000 100%);
    }

    .overlay{
        position:absolute;
        top:40px;
        left:50%;
        transform:translateX(-50%);
        z-index:10;
        text-align:center;
        color:white;
        pointer-events:none;
    }

    .title{
        font-size:42px;
        font-weight:700;
        letter-spacing:2px;
        margin-bottom:10px;
        text-shadow:0 0 20px rgba(255,255,255,0.3);
    }

    .subtitle{
        font-size:16px;
        opacity:0.8;
    }

    .ar-button{
        position:absolute;
        bottom:40px;
        left:50%;
        transform:translateX(-50%);
        z-index:20;
        padding:16px 34px;
        border:none;
        border-radius:18px;
        background:linear-gradient(135deg,#ffffff,#d9d9d9);
        color:#000;
        font-size:18px;
        font-weight:700;
        cursor:pointer;
        transition:0.3s;
        box-shadow:
            0 10px 30px rgba(255,255,255,0.15),
            0 0 20px rgba(255,255,255,0.08);
    }

    .ar-button:hover{
        transform:translateX(-50%) scale(1.05);
        box-shadow:
            0 14px 40px rgba(255,255,255,0.2),
            0 0 30px rgba(255,255,255,0.15);
    }

    .loading{
        position:absolute;
        inset:0;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#000;
        z-index:100;
        transition:opacity 0.5s ease;
    }

    .loader{
        width:70px;
        height:70px;
        border-radius:50%;
        border:5px solid rgba(255,255,255,0.1);
        border-top:5px solid white;
        animation:spin 1s linear infinite;
    }

    @keyframes spin{
        to{
            transform:rotate(360deg);
        }
    }

    @media(max-width:768px){
        .title{
            font-size:28px;
        }

        .subtitle{
            font-size:14px;
        }

        .ar-button{
            width:80%;
            font-size:16px;
            padding:15px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="loading" id="loading">
        <div class="loader"></div>
    </div>

    <div class="overlay">
        <div class="title">AR EXPERIENCE</div>
        <div class="subtitle">Interactive 3D Model Viewer</div>
    </div>

    <model-viewer
        id="viewer"
        src="qwe.glb"
        ios-src="qwe.glb.usdz"
        alt="3D Model"
        ar
        ar-modes="scene-viewer quick-look webxr"
        camera-controls
        touch-action="pan-y"
        shadow-intensity="1.5"
        exposure="1"
        auto-rotate
        rotation-per-second="25deg"
        camera-orbit="0deg 75deg 2.5m"
        field-of-view="30deg"
        environment-image="neutral"
        poster=""
        loading="eager"
    >
    </model-viewer>

    <button class="ar-button" onclick="activateAR()">
        OPEN AR
    </button>

</div>

<script>
    const viewer = document.getElementById('viewer');
    const loading = document.getElementById('loading');

    viewer.addEventListener('load', () => {
        loading.style.opacity = '0';
        setTimeout(() => {
            loading.style.display = 'none';
        }, 500);
    });

    function activateAR(){
        viewer.activateAR();
    }
</script>

</body>
</html>
